<section class="card">
  <p class="num">Вопрос под номером {{ total() }}</p>
  @let newQuestion = question();

  <h2>{{ newQuestion?.text }}</h2>
  <div class="options">
    @for (option of newQuestion.options; track option) {
      <button type="button" class="option" (click)="answer.emit(option)">
        <span class="option-marker"></span>
        <span class="option-text">{{ option }}</span>
      </button>
    }
  </div>
</section>
