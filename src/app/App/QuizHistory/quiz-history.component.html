<section class="history">
  <div class="header-row">
    <h2>История квизов</h2>
    <button type="button" class="btn-back" (click)="backToMenu.emit()">
      ← В меню
    </button>
  </div>

  @if (attempts().length === 0) {
    <p class="empty">Нет пройденных квизов</p>
  } @else {
    <ul>
      @for (attempt of attempts(); track attempt.id) {
        <li>
          <div class="row">
            <div class="info">
              <p class="title">{{ attempt.quizTitle }}</p>
              <p class="user">{{ attempt.userName }}</p>
            </div>
            <div class="result">
              <span class="score"
                >{{ attempt.score }} / {{ attempt.total }}</span
              >
            </div>
          </div>
        </li>
      }
    </ul>
  }
</section>
