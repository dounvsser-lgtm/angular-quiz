<main class="app">
  <header class="titleHeader">
    <h1>Квиз</h1>
    <p class="subtitle">Вопросы по angular</p>
  </header>
  @if (!quiz.finished()) {
    <div class="progress-meta">
      <span>Прогресс</span>
      <span>{{ quiz.index() }} / {{ quiz.total() }}</span>
    </div>
    <app-question-card
      [question]="quiz.currentQuestion()"
      [total]="quiz.questions().length"
      (answer)="onAnswer($event)"
    />
  } @else {
    @defer {
      <app-result-panel
        [total]="quiz.questions().length"
        [score]="quiz.score()"
      />
    } @placeholder {
      <p class="loading">Считаем результат</p>
    }

    <button type="button" class="again" (click)="restart()">Повторить</button>
  }
</main>
