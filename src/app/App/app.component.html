<main class="app">
  <header class="titleHeader">
    <h1>Квиз</h1>
    <p class="subtitle">Вопросы по angular</p>
  </header>
  @if (!finished()) {
    @let newIndex = index();
    <div class="progress-meta">
      <span>Прогресс</span>
      <span>{{ newIndex }} / {{ questions.length }}</span>
    </div>
    <app-question-card
      [currentIndexQuestion]="newIndex + 1"
      [question]="questions[newIndex]"
      [total]="questions.length"
      (answer)="onAnswer($event)"
    />
  } @else {
    @defer {
      <app-result-panel [total]="questions.length" [score]="score()" />
    } @placeholder {
      <p class="loading">Считаем результат</p>
    }

    <button type="button" class="again" (click)="restart()">Повторить</button>
  }
</main>
