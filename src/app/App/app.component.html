<main class="app">
  <h1>Квиз</h1>

  @if (!finished()) {
    <app-question-card
      [question]="questions[index()]"
      [total]="questions.length"
      (answer)="onAnswer($event)"
    />
  } @else {
    @defer {
      <app-result-panel [total]="questions.length" [score]="score()" />
    } @placeholder {
      <p class="loading">Считаем результат</p>
    }

    <button type="button" class="again" (click)="restart()">Повторить</button>
  }
</main>
